[project]
name = "multimodel-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niteesh254", email = "niteeshkrishna254@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
multimodel-rag = "multimodel_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
